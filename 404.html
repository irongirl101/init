<script>
  // Smart client-side redirect for clean GitHub Pages URLs
  // Handles requests missing trailing slashes like /init/games -> /init/games/
  (function() {
    try {
      var currentPath = window.location.pathname;
      var rawBase = "/init".replace(/\/+$/, '');
      
      var routes = ['/blog', '/portfolio', '/games'];
      for (var i = 0; i < routes.length; i++) {
        var fullRoute = rawBase + routes[i];
        if (currentPath === fullRoute || currentPath === fullRoute + '.html') {
          window.location.replace(fullRoute + '/' + window.location.search + window.location.hash);
          return;
        }
      }
    } catch (e) {
      // Fall through to 404 display
    }
  })();
</script>
