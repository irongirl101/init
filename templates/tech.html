{% extends "base.html" %}

{% block content %}
<style>
  html, body {
    background-color: #050811 !important;
    overflow: hidden !important;
    padding-top: 0 !important;
    margin: 0 !important;
    height: 100vh !important;
  }
  #res-canvas {
    display: none !important;
  }
  main {
    max-width: 100vw !important;
    width: 100vw !important;
    padding: 0 !important;
    margin: 0 !important;
    height: 100vh !important;
  }
  footer {
    display: none !important;
  }
  .glass-navbar {
    background: rgba(5, 8, 17, 0.65) !important;
    border-color: rgba(52, 211, 153, 0.25) !important;
    backdrop-filter: blur(14px) !important;
  }
  #project-modal {
    background: rgba(3, 6, 12, 0.82) !important;
    align-items: flex-start !important;
    overflow-y: auto;
    padding-top: max(1rem, env(safe-area-inset-top));
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
  }
  .modal-panel {
    --modal-accent: #34d399;
    position: relative;
    display: flex;
    flex-direction: column;
    flex: 0 0 auto;
    margin-block: auto;
    max-height: calc(100dvh - 2rem - env(safe-area-inset-top) - env(safe-area-inset-bottom)) !important;
    overflow: hidden !important;
    isolation: isolate;
    border-color: #303744 !important;
    background: #0b0e14 !important;
    box-shadow: 0 24px 72px rgba(0, 0, 0, 0.58) !important;
    transform: translateY(18px) scale(0.975);
    transition: transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #project-modal.opacity-100 .modal-panel {
    transform: translateY(0) scale(1);
  }
  .modal-topbar {
    flex: 0 0 auto;
    background: #0e121a !important;
    border-color: #252c37 !important;
  }
  .modal-content {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .modal-close {
    transition: color 160ms ease, background-color 160ms ease, transform 160ms ease;
  }
  .modal-close:hover {
    color: white !important;
    background: rgba(255, 255, 255, 0.08) !important;
    transform: rotate(90deg);
  }
  .modal-hero {
    position: relative;
    display: flex;
    min-height: 132px;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #252c37;
    padding: 0.5rem 0.35rem 1.25rem;
  }
  .modal-hero-copy {
    position: relative;
    z-index: 1;
    min-width: 0;
    max-width: 78%;
  }
  .modal-tech-logo {
    position: absolute;
    top: 50%;
    right: 1.3rem;
    width: 104px;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    transform: translateY(-50%);
  }
  .modal-tech-logo svg,
  .modal-tech-logo img {
    width: 54px;
    height: 54px;
    color: var(--tech-logo-color, white);
  }
  .modal-tech-logo img {
    width: 92px;
    height: 92px;
    object-fit: contain;
    image-rendering: pixelated;
  }
  .modal-record-section {
    border-color: #252c37 !important;
    border-radius: 0.55rem !important;
    background: #10141c !important;
  }
  #modal-focus-planet,
  #modal-link-container a {
    min-height: 2.8rem;
    border-radius: 0.7rem;
    transition: background-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
  }
  #modal-focus-planet:hover,
  #modal-link-container a:hover {
    background: color-mix(in srgb, var(--modal-accent) 10%, #0b0e14);
  }
  @media (prefers-reduced-motion: reduce) {
    .modal-panel,
    .modal-close,
    #modal-focus-planet,
    #modal-link-container a {
      transition: none;
    }
  }
  @media (max-width: 1023px) {
    .glass-navbar {
      width: calc(100% - 2rem);
    }
    .glass-navbar .navbar {
      min-width: 0;
      flex-wrap: wrap;
      padding-inline: 0.5rem;
    }
    .glass-navbar .navbar > .flex-1 {
      min-width: 0;
    }
    .glass-navbar .navbar > .flex-none {
      width: 100%;
      min-width: 0;
      justify-content: flex-start;
    }
    .glass-navbar .menu {
      flex-wrap: wrap;
    }
    .tech-header-badge {
      top: 7.5rem;
      left: 1rem;
      width: fit-content;
      max-width: min(calc(100vw - 2rem), 17rem);
    }
    .tech-header-badge > div {
      width: auto;
      max-width: 100%;
    }
    .tech-header-badge p {
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .modal-hero-copy {
      max-width: calc(100% - 76px);
    }
    .modal-tech-logo {
      right: 0.8rem;
      width: 78px;
    }
    .modal-tech-logo svg {
      width: 38px;
      height: 38px;
    }
    .modal-tech-logo img {
      width: 78px;
      height: 78px;
    }
  }
</style>

<div id="tech-observatory-root" class="relative w-screen h-screen overflow-hidden select-none font-mono">

  <!-- 2D Canvas Surface -->
  <canvas id="tech-canvas" class="absolute inset-0 w-full h-full block cursor-grab active:cursor-grabbing"></canvas>

  <!-- Top-Left Floating Header Badge -->

  <div class="tech-header-badge absolute top-24 left-5 sm:left-9 z-30 pointer-events-auto max-w-[calc(100vw-2rem)]">
    <div class="flex items-start gap-2.5 w-full max-w-full bg-[#070b14]/85 backdrop-blur-xl px-3.5 py-2 rounded-xl border border-emerald-500/30 shadow-[0_8px_32px_rgba(0,0,0,0.8)] text-slate-200">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <div class="min-w-0">
        <div class="font-bold text-xs tracking-wider text-white flex items-center gap-2">
          <span>{{ page.subtitle }}</span>
        </div>
        <p class="text-[10px] text-slate-400 mt-0.5 whitespace-normal">
          Scroll or drag up to ascend into space • Click planets & moons
        </p>
      </div>
    </div>
  </div>

  <!-- Bottom-Left Earth Anchor Quick Return -->
  <div class="absolute bottom-5 left-4 sm:left-6 z-30 pointer-events-auto">
    <button id="btn-return-earth" onclick="window.dispatchEvent(new CustomEvent('return-earth'))" class="btn btn-xs sm:btn-sm bg-[#070b14]/90 hover:bg-emerald-950/60 border border-emerald-500/30 text-emerald-300 font-mono text-[11px] rounded-xl shadow-lg flex items-center gap-1.5 backdrop-blur-md">
      <span>Ground yourself</span>
    </button>
  </div>

  <!-- Project & Planet Modal Overlay -->
  <div id="project-modal" class="fixed inset-0 z-[100] flex items-center justify-center overflow-y-auto p-4 bg-black/70 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-200">
    <div class="modal-panel relative max-h-[calc(100vh-2rem)] w-full max-w-2xl overflow-y-auto rounded-2xl border bg-[#080d1a] text-white">
      <div class="modal-topbar sticky top-0 z-10 flex items-center justify-between border-b px-5 py-3 pr-14 font-mono text-[9px] tracking-[0.18em] text-slate-400 backdrop-blur-xl">
        <span>TECH <span class="text-slate-600">/</span> PROFILE</span>
      </div>
      <button id="modal-close-btn" class="modal-close btn btn-sm btn-circle btn-ghost absolute right-2 top-1.5 z-20 text-slate-400" aria-label="Close">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
      </button>
      <div class="modal-content space-y-5 p-4 sm:space-y-6 sm:p-7">
        <section class="modal-hero">
          <div class="modal-hero-copy">
            <div class="mb-3">
              <span id="modal-badge" class="badge badge-outline rounded px-2.5 py-2.5 font-mono text-[9px] tracking-[0.12em]">
                PROJECT SATELLITE
              </span>
            </div>
            <h3 id="modal-title" class="mb-1.5 text-2xl font-bold font-sans tracking-tight text-white sm:text-3xl">
              Project Title
            </h3>
            <p id="modal-subtitle" class="max-w-lg text-[11px] leading-relaxed text-slate-400 font-mono sm:text-xs">
              Python · Backend & Systems Tooling
            </p>
          </div>
          <div id="modal-tech-logo" class="modal-tech-logo" aria-hidden="true"></div>
        </section>

        <div id="modal-desc" class="space-y-4 text-xs leading-relaxed text-slate-200 font-sans">
          Project description goes here.
        </div>

        <div class="flex items-center justify-between border-t border-white/10 pt-4 font-mono text-[9px] uppercase tracking-[0.16em] text-slate-600">
          <span>INIT</span>
          <span>TECH STACK</span>
        </div>

        <div id="modal-link-container"></div>
      </div>
    </div>
  </div>

</div>

<script id="tech-planet-data" type="application/json">{{ page.planets | tojson }}</script>

{% endblock %}
