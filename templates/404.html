{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">
  <div class="relative mb-6">
    <span class="text-8xl sm:text-9xl font-black font-mono tracking-tighter text-emerald-500/10 select-none">404</span>
    <div class="absolute inset-0 flex flex-col items-center justify-center">
      <span class="text-xs uppercase tracking-widest font-mono text-emerald-400 font-semibold px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20">
        Lost in Topography
      </span>
    </div>
  </div>

  <h1 class="text-3xl sm:text-4xl font-bold font-mono tracking-tight text-white mb-4">
    Coordinates Not Found
  </h1>
  <p class="text-zinc-400 max-w-md text-sm sm:text-base leading-relaxed mb-8">
    The sector you are navigating to has drifted outside recorded coordinates or no longer exists.
  </p>

  <div class="flex flex-wrap items-center justify-center gap-4">
    <a href="{{ site.base_url }}/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 hover:border-emerald-500/60 font-mono text-xs sm:text-sm tracking-wide transition-all shadow-lg shadow-emerald-950/40">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      Return to Base
    </a>
    <a href="{{ site.base_url }}/blog/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-zinc-800/60 hover:bg-zinc-800 text-zinc-300 border border-zinc-700 font-mono text-xs sm:text-sm tracking-wide transition-all">
      Read Blog
    </a>
    <a href="{{ site.base_url }}/games/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-zinc-800/60 hover:bg-zinc-800 text-zinc-300 border border-zinc-700 font-mono text-xs sm:text-sm tracking-wide transition-all">
      Games Shelf
    </a>
  </div>
</div>

<script>
  // Smart client-side redirect for clean GitHub Pages URLs
  // Handles requests missing trailing slashes like /init/games -> /init/games/
  (function() {
    try {
      var currentPath = window.location.pathname;
      var rawBase = "{{ site.base_url }}".replace(/\/+$/, '');
      
      var routes = ['/blog', '/portfolio', '/games'];
      for (var i = 0; i < routes.length; i++) {
        var fullRoute = rawBase + routes[i];
        if (currentPath === fullRoute || currentPath === fullRoute + '.html') {
          window.location.replace(fullRoute + '/' + window.location.search + window.location.hash);
          return;
        }
      }
    } catch (e) {
      // Fall through to 404 display
    }
  })();
</script>
{% endblock %}
